[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "order-flow-imbalance-strategy"
version = "0.1.0"
description = "ML-enhanced Order Flow Imbalance research pipeline for crypto markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.30",
    "tqdm>=4.66",
    "pandas>=2.0",
    "polars>=1.30",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "requests-mock",
]

[project.scripts]
ofi-multihorizon-fusion = "order_flow_imbalance_strategy.multihorizon_fusion.cli:main"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not network'"
markers = [
    "network: live integration tests that require external network access",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
